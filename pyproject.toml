[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmony_filtering_service"]

[project]
name = "harmony-filtering"
dynamic = ["version"]
description = ""
authors = [
    { name = "Syed Rizvi", email = "syed.r.rizvi@nasa.gov" }
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
  "dask (>=2026.3.0)",
  "harmony-service-lib (>=2.6.0,<3.0.0)",
  "numpy (>=1.20.0)",
  "xarray (>=2022.11.0)",
  "netCDF4 (>=1.5.6)",
  "earthaccess (>=0.14.0)",
  "jsonschema (>=4.23.0)",
  "pytest>=9.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "mypy>=1.9.0",
    "ruff>=0.5.0",
    "pytest-cov>=5.0.0",
    "mkdocs>=1.6.0",
    "markdown-callouts>=0.4.0",
    "markdown-include>=0.8.1",
    "mkdocstrings>=0.25.1",
    "mkdocs-jupyter>=0.24.7",
    "mkdocs-material>=9.5.22",
    "mkdocstrings-python>=1.16.12",
]
harmony = [
    "harmony-service-lib>=2.0.0"
]
integration = [
    "harmony-py>=0.4.15"
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# This tells hatch-vcs to use an env var if git metadata is unavailable
version_scheme = "no-guess-dev"

[tool.mypy]
# Target Python version
python_version        = "3.12"
strict                = false
ignore_missing_imports = true
# Skip tests entirely
exclude = "tests/.*"

[tool.pylint.'MASTER']
disable = ["C0114", "C0115", "C0116"]

[tool.ruff]
builtins = ["ellipsis"]
exclude = [
  ".eggs",
  "doc",
  "_typed_ops.pyi",
]
# Allow lines to be as long as 100.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "E402",  # module level import not at top of file
    "E501",  # line too long - let ruff format handle it
    "E731",  # do not assign a lambda expression, use a def
]

[tool.pytest]
markers = [
    "integration: marks tests as integration tests"
]
